name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, align/dfy-fe-be-contract]

permissions:
  contents: read

jobs:
  typecheck-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android
