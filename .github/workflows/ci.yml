name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, align/dfy-fe-be-contract]

permissions:
  contents: read

jobs:
  typecheck-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Configure Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build debug APK (requires Metro)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dfy-mobile-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build standalone release APK (bundles JavaScript)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: dfy-mobile-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
